# 三足环 · 3 人混战
#
# 3 个出生据点与 3 个中立要塞沿六节点环交替分布。相邻据点之间固定间隔
# 5 块关联地块，因此任意两名玩家之间的短路线都恰好经过 1 座中立要塞，
# 路程与防御成本完全一致。关联地块使用固定防御值，避免矩形落格引入座位偏差。

[map]
name = "三足环 · 3 人混战"
width = 17
height = 9
layout = [
  ".................",
  "..#############..",
  "..#...........#..",
  "..#...........#..",
  "..#...........#..",
  "..#...........#..",
  "..#...........#..",
  "..#############..",
  ".................",
]

# 环上顺时针顺序：玩家 → 中立 → AI2 → 中立 → AI1 → 中立。

[[base]]
subject = "chinese"
owner = "player"
pos = [8, 1]
garrison = 20
production_base = 2.5
linked_tiles = [
  { pos = [9, 1] }, { pos = [10, 1] }, { pos = [11, 1] },
  { pos = [12, 1] }, { pos = [13, 1] },
]

