# H 型地图 · 对角 1v1（v2：链条式，全地块皆有关联据点）
#
# 坐标系：左上角为 (0,0)，x 向右，y 向下。
# 布局：左右两条竖链 + 中间一条横链，全部为 1 格宽链条。
# 6 个据点：玩家=语文(左下)，AI=数学(右上)，中立要塞=化学/音乐/物理/地理。
# 对称性：整张地图关于中心 180° 旋转对称。

[map]
name = "H 型 · 链条 v2"
width = 14
height = 13
layout = [
  "..............",  # y=0
  "..#........#..",  # y=1   化学        数学
  "..#........#..",  # y=2
  "..#........#..",  # y=3
  "..#........#..",  # y=4
  "..#........#..",  # y=5
  "..##########..",  # y=6   物理—横梁—地理
  "..#........#..",  # y=7
  "..#........#..",  # y=8
  "..#........#..",  # y=9
  "..#........#..",  # y=10
  "..#........#..",  # y=11  语文        音乐
  "..............",  # y=12
]

# ---- 据点 ----
# 每个据点 4 块关联地块（沿链条相邻）；知识点名称每局从该学科词库随机抽取（不重复）

[[base]]
subject = "chinese"
owner = "player"
pos = [2, 11]
garrison = 20
production_base = 2.5
linked_tiles = [
  { pos = [2, 10] },
  { pos = [2, 9] },
  { pos = [2, 8] },
  { pos = [2, 7] },
]

