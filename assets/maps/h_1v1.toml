# ---- 中立普通地块 ----
# v2 地图没有普通地块（全地块皆关联），本节保留仅为 schema 兼容。
[neutral]
defense_min = 21
defense_max = 24
beam_defense_min = 21
beam_defense_max = 24
seed = 42
rotational_symmetry = true

# ---- 关联地块数值 ----
[linked_tile]
defense_min = 21        # 防御值集中在 21~24，不要大随机
defense_max = 24
production_bonus = 0.2  # 每块 +0.2 兵/秒；基础 2.5，4 块全占 = 3.3 兵/秒

# ---- 全局规则 ----
[rules]
garrison_cap_base = 80      # 据点驻军基础上限
garrison_cap_per_tile = 10  # 每块已占领关联地块 +10 上限
regen_per_sec = 1.0
squad_interval_sec = 0.2
squad_max_size = 3                 # 40 兵以内每波 3 兵
squad_growth_garrison_step = 40    # 40～120 兵时，每多 40 驻军，理论每波兵力 +1
squad_soft_cap_garrison = 120      # 超过 120 后改用平方根缓增长
squad_move_sec_per_cell = 0.4
